#cloud-config
# See the autoinstall documentation at:
# https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
autoinstall:
  apt:
    disable_components: []
    fallback: offline-install
    geoip: true
    mirror-selection:
      primary:
      - country-mirror
      - arches: &id001
        - amd64
        - i386
        uri: http://archive.ubuntu.com/ubuntu/
      - arches: &id002
        - s390x
        - arm64
        - armhf
        - powerpc
        - ppc64el
        - riscv64
        uri: http://ports.ubuntu.com/ubuntu-ports
    preserve_sources_list: false
    security:
    - arches: *id001
      uri: http://security.ubuntu.com/ubuntu/
    - arches: *id002
      uri: http://ports.ubuntu.com/ubuntu-ports
  codecs:
    install: false
  drivers:
    install: false
  identity:
    hostname: ubuntu22
    password: $6$x6Vmx6pGCqAIoxoK$w98T3.aTTPdCmlWHKI.1DC2yfxh2EIQXpVfx7na08xtFyJi6X6Yta2nkWji2a8/WfQrw5bHCep3wX4LnwKpYV0
    realname: user
    username: user
  user-data:
    disable_root: false
    chpasswd:
      list:
        - root:$6$0s1HLA7YnBDAiQQi$r7/jG9GkRGDB4PhFLNRkU01WoJpXw/hSKIk3BNDnNVCgyG6wDGrhf4kb.NPHPO5X3XrBPwLkY6aDMs72hQPjy0
      expire: false
    runcmd:
      # ── Repos & packages ─────────────────────────────────────────────────────
      - curl -sSL https://repo.45drives.com/key/gpg.asc | gpg --dearmor -o /usr/share/keyrings/45drives.gpg
      - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/45drives.gpg] https://repo.45drives.com/enterprise/ubuntu jammy main" > /etc/apt/sources.list.d/45drives.list
      - curl -sSL https://download.ceph.com/keys/release.asc | gpg --dearmor -o /usr/share/keyrings/ceph.gpg
      - echo "deb [signed-by=/usr/share/keyrings/ceph.gpg] https://download.ceph.com/debian-19.2.3/ jammy main" > /etc/apt/sources.list.d/ceph.list
      - apt-get update
      - apt-get install -y 45drives-tools cephadm podman cockpit firewalld cockpit-benchmark cockpit-navigator cockpit-file-sharing cockpit-45drives-hardware cockpit-identities realmd tuned udisks2-lvm2 samba winbind nfs-kernel-server nfs-client cockpit-scheduler nano
      # ── Firewall ─────────────────────────────────────────────────────────────
      - systemctl start firewalld
      - firewall-cmd --zone=public --permanent --add-service=cockpit
      - firewall-cmd --reload
      - systemctl enable cockpit.socket
      # ── Networking ───────────────────────────────────────────────────────────
      - |
        tee /etc/netplan/00-networkmanager.yaml <<'EOF'
        network:
          version: 2
          renderer: NetworkManager
        EOF
      - mv /etc/netplan/00-installer-config.yaml /etc/netplan/00-installer-config.yaml.backup
      - ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
      - mv /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf.backup
      - sed -i '/^managed/s/false/true/' /etc/NetworkManager/NetworkManager.conf
      - systemctl restart NetworkManager
      # ── Ceph & cleanup ───────────────────────────────────────────────────────
      - cephadm pull
      - apt-get autoremove --purge -y snapd
      - touch /etc/cloud/cloud-init.disabled
      # ── EFI mirror setup ─────────────────────────────────────────────────────
      - mkdir -p /boot/efi2
      - |
        EFI1_UUID=$(blkid -s UUID -o value /dev/sda1)
        EFI2_UUID=$(blkid -s UUID -o value /dev/sdb1)
        sed -i '\|/boot/efi|d' /etc/fstab
        echo "UUID=${EFI1_UUID}  /boot/efi   vfat  errors=remount-ro,nofail        0  0" >> /etc/fstab
        echo "UUID=${EFI2_UUID}  /boot/efi2  vfat  errors=remount-ro,nofail,noauto 0  0" >> /etc/fstab
      # ── grub.d sync script ───────────────────────────────────────────────────
      - |
        tee /etc/grub.d/90_copy_to_boot_efi2 <<'EOF'
        #!/bin/sh
        # https://wiki.debian.org/UEFI#RAID_for_the_EFI_System_Partition
        set -e

        if mountpoint --quiet /boot/efi; then
            mount /boot/efi2 || :
            rsync --times --recursive --delete /boot/efi/ /boot/efi2/
            umount /boot/efi2
        fi
        exit 0
        EOF
      - chmod +x /etc/grub.d/90_copy_to_boot_efi2
      - bash /etc/grub.d/90_copy_to_boot_efi2
  early-commands:
    # ── Dynamic drive detection with safeguards ───────────────────────────────
    #
    # Accepted disk types (resolved symlink must match):
    #   /dev/sd*   — covers SAS, SATA, SCSI, and ATA drives
    #   /dev/nvme* — covers NVMe drives
    #
    # Safeguard — a disk is skipped if any of the following are detected:
    #   LVM  — LVM2_member signature (active PV)
    #   ZFS  — zfs_member signature
    #   Ceph — ceph_bluestore signature or Ceph partition type GUIDs
    #
    # Note: linux_raid_member is intentionally NOT checked here because
    # late-commands runs after the RAID is built and would false-positive.
    # Disk paths are saved to /run/autoinstall-disks so late-commands can
    # read them directly without needing to re-detect.
    - |
      set -e

      disk_is_safe() {
        DISK="$1"
        for DEV in ${DISK} $(lsblk -ln -o NAME "${DISK}" 2>/dev/null | tail -n +2 | awk '{print "/dev/"$1}'); do
          TYPE=$(blkid -s TYPE -o value "${DEV}" 2>/dev/null || true)
          case "$TYPE" in
            LVM2_member)
              echo "SKIP: ${DISK} — LVM PV found on ${DEV}" > /dev/kmsg
              return 1
              ;;
            zfs_member)
              echo "SKIP: ${DISK} — ZFS member found on ${DEV}" > /dev/kmsg
              return 1
              ;;
            ceph_bluestore)
              echo "SKIP: ${DISK} — Ceph BlueStore OSD found on ${DEV}" > /dev/kmsg
              return 1
              ;;
          esac
          # Catch Ceph partition type GUIDs that blkid TYPE may miss
          PARTTYPE=$(blkid -s PART_ENTRY_TYPE -o value "${DEV}" 2>/dev/null || true)
          case "$PARTTYPE" in
            4fbd7e29-9d25-41b8-afd0-062c0ceff05d|\
            45b0969e-9b03-4f30-b4c6-b4b80ceff106|\
            cafecafe-9b03-4f30-b4c6-b4b80ceff106)
              echo "SKIP: ${DISK} — Ceph partition GUID found on ${DEV}" > /dev/kmsg
              return 1
              ;;
          esac
        done
        return 0
      }

      VALID_DISKS=""
      for BYPATH in $(ls /dev/disk/by-path/ | grep -v '\-part[0-9]' | sort); do
        TARGET=$(readlink -f /dev/disk/by-path/${BYPATH})
        case "$TARGET" in
          /dev/sd*|/dev/nvme*)
            if disk_is_safe "${TARGET}"; then
              VALID_DISKS="${VALID_DISKS} ${TARGET}"
              echo "Autoinstall: accepted disk ${TARGET} (${BYPATH})" > /dev/kmsg
            fi
            ;;
          *)
            echo "Autoinstall: skipped ${TARGET} — not a supported disk type" > /dev/kmsg
            ;;
        esac
      done

      # Deduplicate (nvme by-path can produce duplicate entries)
      VALID_DISKS=$(echo $VALID_DISKS | tr ' ' '\n' | sed '/^$/d' | sort -u)

      DISK1=$(echo "$VALID_DISKS" | sed -n '1p')
      DISK2=$(echo "$VALID_DISKS" | sed -n '2p')

      if [ -z "$DISK1" ] || [ -z "$DISK2" ]; then
        echo "ERROR: Could not detect two suitable disks. Found: ${VALID_DISKS}" > /dev/kmsg
        exit 1
      fi

      echo "Autoinstall: DISK1=${DISK1}" > /dev/kmsg
      echo "Autoinstall: DISK2=${DISK2}" > /dev/kmsg

      # Persist disk paths for late-commands — detection cannot be safely
      # repeated after install because RAID signatures will be present
      echo "DISK1=${DISK1}" >  /run/autoinstall-disks
      echo "DISK2=${DISK2}" >> /run/autoinstall-disks

      sed -i "s|DISK1_PATH|${DISK1}|g" /autoinstall.yaml
      sed -i "s|DISK2_PATH|${DISK2}|g" /autoinstall.yaml
  kernel:
    package: linux-generic
  keyboard:
    layout: us
    toggle: null
    variant: ''
  locale: en_US.UTF-8
  network:
    ethernets:
      all-nics:
        match:
          name: e*
        dhcp4: true
    version: 2
  oem:
    install: auto
  source:
    id: ubuntu-server
    search_drivers: false
  ssh:
    allow-pw: true
    authorized-keys: []
    install-server: true
  storage:
    config:
    # ── Disk declarations ─────────────────────────────────────────────────────
    # DISK1_PATH and DISK2_PATH are replaced at install time by early-commands
    # with the actual /dev/sdX or /dev/nvmeXnY paths detected from by-path
    - ptable: gpt
      path: DISK1_PATH
      wipe: superblock-recursive
      preserve: false
      name: ''
      grub_device: false
      id: disk-sda
      type: disk
    - ptable: gpt
      path: DISK2_PATH
      wipe: superblock-recursive
      preserve: false
      name: ''
      grub_device: false
      id: disk-sdb
      type: disk

    # ── sda partitions ────────────────────────────────────────────────────────
    # sda1 — EFI System Partition (1 GiB, FAT32)
    - device: disk-sda
      size: 1073741824
      flag: boot
      number: 1
      preserve: false
      grub_device: true
      offset: 1048576
      id: partition-0
      type: partition

    # sda2 — RAID1 member for /
    - device: disk-sda
      size: -1
      wipe: superblock
      number: 2
      preserve: false
      grub_device: false
      offset: 1074790400
      id: partition-1
      type: partition

    # ── sdb partitions ────────────────────────────────────────────────────────
    # sdb1 — mirror ESP (1 GiB, FAT32); noauto in fstab, mounted only by sync script
    - device: disk-sdb
      size: 1073741824
      flag: boot
      number: 1
      preserve: false
      grub_device: false
      offset: 1048576
      id: partition-2
      type: partition

    # sdb2 — RAID1 member for /
    - device: disk-sdb
      size: -1
      wipe: superblock
      number: 2
      preserve: false
      grub_device: false
      offset: 1074790400
      id: partition-3
      type: partition

    # ── EFI formats & mount ───────────────────────────────────────────────────
    - fstype: fat32
      volume: partition-0
      preserve: false
      id: format-efi
      type: format

    - path: /boot/efi
      device: format-efi
      id: mount-efi
      type: mount

    # sdb1 formatted FAT32 but not mounted by installer
    - fstype: fat32
      volume: partition-2
      preserve: false
      id: format-efi-b
      type: format

    # ── RAID1 array for / ─────────────────────────────────────────────────────
    - name: md0
      raidlevel: raid1
      devices:
      - partition-1
      - partition-3
      spare_devices: []
      preserve: false
      wipe: superblock-recursive
      ptable: gpt
      id: raid-0
      type: raid

    # md0p1 — single partition spanning the full RAID array
    - device: raid-0
      size: -1
      wipe: superblock
      number: 1
      preserve: false
      grub_device: false
      offset: 1048576
      id: partition-4
      type: partition

    - fstype: ext4
      volume: partition-4
      preserve: false
      id: format-root
      type: format

    - path: /
      device: format-root
      id: mount-root
      type: mount

    swap:
      size: 0
  updates: security
  version: 1
  late-commands:
    - curtin in-target --target=/target -- apt update
    - curtin in-target --target=/target -- apt upgrade -y
    - curtin in-target -- sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
    # ── sdb ESP — install grub so sdb can boot independently ─────────────────
    # Read disk paths saved by early-commands — avoids re-detection against
    # a post-install disk that now carries linux_raid_member signatures
    - |
      set -e

      if [ ! -f /run/autoinstall-disks ]; then
        echo "ERROR: /run/autoinstall-disks not found — cannot determine DISK2" > /dev/kmsg
        exit 1
      fi

      . /run/autoinstall-disks

      # Build partition path — sd* uses sdX1, nvme* uses nvmeXnYp1
      case "$DISK2" in
        /dev/nvme*)
          DISK2_PART1="${DISK2}p1"
          ;;
        *)
          DISK2_PART1="${DISK2}1"
          ;;
      esac

      echo "late-commands: installing grub to ${DISK2} ESP ${DISK2_PART1}" > /dev/kmsg

      mkdir -p /target/boot/efi2
      mount ${DISK2_PART1} /target/boot/efi2
      rsync -a /target/boot/efi/ /target/boot/efi2/
      curtin in-target --target=/target -- grub-install --target=x86_64-efi --efi-directory=/boot/efi2 --bootloader-id=ubuntu-sdb --recheck ${DISK2}
      umount /target/boot/efi2
      rmdir /target/boot/efi2

