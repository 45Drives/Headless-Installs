# --- GLOBAL SETTINGS ---
cmdline
reboot
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc
rootpw --iscrypted $6$pAzKGjUDjrB.xYXL$AtpXHI/jZlKkSHzK0gohKcSB6VtUzGRGQ9r.y2PMVyC3rmPddjDtO3juTVuhx6awd/62Q93rRmFqAnabUtgTp0
firstboot --enable

# --- SOFTWARE SELECTION ---
%packages
@^minimal-environment
@base
@core
%end

# --- REPOS ---
url --url="https://dl.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://dl.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/"

%include /tmp/disk-config

# -------------------------------------------------
# PRE-INSTALL: Dynamic Disk Selection
# -------------------------------------------------
%pre --log=/tmp/ks-pre.log --interpreter=/bin/bash
touch /tmp/disk-config

# -------------------------------------------------
# DISK SELECTION CRITERIA (optional)
# -------------------------------------------------
# Set any combination of the following to restrict which disks are
# chosen as install targets. Leave a variable empty to skip that filter.
#
# TARGET_MODELS — newline-delimited list of model substrings (case-insensitive).
#                 Each line is matched against lsblk MODEL; a disk is accepted
#                 if any entry is found as a substring of its model string.
#                 Leave empty to skip model filtering entirely.
#
# TARGET_SIZE_GB — nominal size in GiB. Disks within ±10% of this value
#                  match, accommodating manufacturer rounding differences.
#                  e.g. "480" matches a 480 GiB SSD reported as 447 GiB.
#
# TARGET_TRAN   — transport type as reported by lsblk TRAN column.
#                 Common values: sata  nvme  sas
#                 e.g. "sata" restricts selection to SATA drives only.
#
# If all three are empty, the first two eligible non-removable,
# non-mounted disks (alphabetically by device name) are used.
# -------------------------------------------------
TARGET_MODELS=$(cat <<'MODELLIST'
MODELLIST
)
TARGET_SIZE_GB=""
TARGET_TRAN=""

# -------------------------------------------------
# Deactivate any active md RAID arrays FIRST so that
# reinstall targets don't show stale mountpoints when
# disk selection runs below
# -------------------------------------------------
mdadm --stop --scan 2>/dev/null || true

# Build candidate disk list
# Excludes: non-disk devices, removable devices (USB), mounted disks
REAL_DISKS=""
for DISK in $(lsblk -dno NAME,TYPE,RM | awk '$2=="disk" && $3=="0" {print $1}' | sort); do

    # Skip disks that contain the installer media mount point.
    # We intentionally do NOT filter on any mounted filesystem here,
    # because the Anaconda installer briefly probes/mounts EFI and boot
    # partitions from prior installs during hardware discovery — a broad
    # mount check would incorrectly exclude valid reinstall target disks.
    if lsblk -lno MOUNTPOINT /dev/$DISK 2>/dev/null | \
            grep -qE '^/run/install|^/mnt/install|^/run/media'; then
        echo "Skipping /dev/$DISK — contains installer media mount point"
        continue
    fi

    # --- MODEL filter ---
    if [ -n "$TARGET_MODELS" ]; then
        DISK_MODEL=$(lsblk -dno MODEL /dev/$DISK 2>/dev/null)
        MODEL_MATCHED=0
        while IFS= read -r TARGET_MODEL; do
            [ -z "$TARGET_MODEL" ] && continue
            if echo "$DISK_MODEL" | grep -qi "$TARGET_MODEL"; then
                MODEL_MATCHED=1
                break
            fi
        done <<< "$TARGET_MODELS"
        if [ "$MODEL_MATCHED" -eq 0 ]; then
            echo "Skipping /dev/$DISK — model '$DISK_MODEL' does not match any target model"
            continue
        fi
    fi

    # --- SIZE filter (±10% tolerance) ---
    if [ -n "$TARGET_SIZE_GB" ]; then
        DISK_BYTES=$(lsblk -bdno SIZE /dev/$DISK 2>/dev/null)
        TARGET_BYTES=$(( TARGET_SIZE_GB * 1024 * 1024 * 1024 ))
        MIN_BYTES=$(( TARGET_BYTES * 90 / 100 ))
        MAX_BYTES=$(( TARGET_BYTES * 110 / 100 ))
        if [ "$DISK_BYTES" -lt "$MIN_BYTES" ] || [ "$DISK_BYTES" -gt "$MAX_BYTES" ]; then
            DISK_GB=$(( DISK_BYTES / 1024 / 1024 / 1024 ))
            echo "Skipping /dev/$DISK — size ${DISK_GB}GiB does not match target ${TARGET_SIZE_GB}GiB (±10%)"
            continue
        fi
    fi

    # --- TRANSPORT filter ---
    if [ -n "$TARGET_TRAN" ]; then
        DISK_TRAN=$(lsblk -dno TRAN /dev/$DISK 2>/dev/null)
        if ! echo "$DISK_TRAN" | grep -qi "$TARGET_TRAN"; then
            echo "Skipping /dev/$DISK — transport '$DISK_TRAN' does not match '$TARGET_TRAN'"
            continue
        fi
    fi

    DISK_MODEL=$(lsblk -dno MODEL /dev/$DISK 2>/dev/null)
    DISK_GB=$(( $(lsblk -bdno SIZE /dev/$DISK 2>/dev/null) / 1024 / 1024 / 1024 ))
    DISK_TRAN=$(lsblk -dno TRAN /dev/$DISK 2>/dev/null)
    echo "Candidate: /dev/$DISK  model='$DISK_MODEL'  size=${DISK_GB}GiB  tran=$DISK_TRAN"

    REAL_DISKS="$REAL_DISKS$DISK
"
done

D1=$(echo "$REAL_DISKS" | sed -n '1p')
D2=$(echo "$REAL_DISKS" | sed -n '2p')

if [ -z "$D1" ] || [ -z "$D2" ]; then
    echo "ERROR: Could not find two eligible target disks matching the configured criteria. Aborting."
    exit 1
fi

echo "Selected install disks: /dev/$D1 and /dev/$D2"

# -------------------------------------------------
# Volume Safety Check (ABORT if LVM/ZFS/Ceph detected)
# -------------------------------------------------

check_disk() {
    DISK=$1
    echo "Checking /dev/$DISK for existing volume metadata..."

    # Build a list of the disk itself plus all its partitions/children
    ALL_DEVS=$(lsblk -lno NAME /dev/$DISK 2>/dev/null)

    for DEV in $ALL_DEVS; do
        # --- LVM ---
        # blkid catches PV signatures even if pvscan hasn't run yet
        if blkid /dev/$DEV 2>/dev/null | grep -qi "LVM2_member"; then
            echo "ERROR: LVM Physical Volume signature detected on /dev/$DEV"
            exit 1
        fi
        # pvs catches active/imported VGs
        if pvs --noheadings -o pv_name 2>/dev/null | grep -q "/dev/$DEV"; then
            echo "ERROR: Active LVM Physical Volume detected on /dev/$DEV"
            exit 1
        fi

        # --- ZFS ---
        if blkid /dev/$DEV 2>/dev/null | grep -qi "zfs_member"; then
            echo "ERROR: ZFS pool member detected on /dev/$DEV"
            exit 1
        fi

        # --- Ceph (filesystem/OSD signatures) ---
        if blkid /dev/$DEV 2>/dev/null | grep -qi "ceph"; then
            echo "ERROR: Ceph filesystem signature detected on /dev/$DEV"
            exit 1
        fi
    done

    # Catch Ceph-owned LVM VGs (e.g. ceph-<uuid>) — these show up in pvs
    # even when the blkid type is just "LVM2_member"
    if pvs --noheadings -o pv_name,vg_name 2>/dev/null \
            | grep "/dev/$DISK" | grep -qi "ceph"; then
        echo "ERROR: Ceph LVM VG detected on /dev/$DISK"
        exit 1
    fi

    # Catch active ceph device-mapper targets (ceph-- prefix in dm names)
    if lsblk -n 2>/dev/null | grep -E "ceph--" | grep -q "$DISK"; then
        echo "ERROR: Active Ceph device-mapper volume on /dev/$DISK"
        exit 1
    fi

    echo "/dev/$DISK is clean — no LVM, ZFS, or Ceph metadata found."
}

check_disk "$D1"
check_disk "$D2"

echo "Both disks passed volume metadata checks. Proceeding with install."

# Wipe any residual md superblocks from target disks so Anaconda
# can cleanly initialize them (belt-and-suspenders after --stop --scan)
for DISK in $D1 $D2; do
    for PART in $(lsblk -lno NAME /dev/$DISK 2>/dev/null | tail -n +2); do
        mdadm --zero-superblock /dev/$PART 2>/dev/null || true
    done
    mdadm --zero-superblock /dev/$DISK 2>/dev/null || true
done

# Detect the primary onboard NIC by excluding loopback and any
# interface whose sysfs path passes through a USB bus.  This prevents
# the installer from trying to configure the USB install-media NIC
# (e.g. enp1s0f4u2u5c2) instead of the real onboard port.
PRIMARY_NIC=""
for NIC in $(ls -1 /sys/class/net/ | grep -v lo | sort); do
    SYSPATH=$(readlink -f /sys/class/net/$NIC 2>/dev/null)
    if echo "$SYSPATH" | grep -q '/usb'; then
        echo "Skipping NIC $NIC — USB-attached"
        continue
    fi
    # Ignore virtual interfaces (bridges, bonds, vlans, loopback aliases)
    if echo "$NIC" | grep -qE '^(virbr|docker|veth|bond|br|dummy|lo)'; then
        continue
    fi
    PRIMARY_NIC=$NIC
    break
done

if [ -z "$PRIMARY_NIC" ]; then
    echo "WARNING: Could not identify a non-USB NIC; falling back to any available interface"
    NETWORK_LINE="network --bootproto=dhcp --onboot=yes --activate --noipv6 --hostname=cephnode"
else
    echo "Primary NIC for installation: $PRIMARY_NIC"
    NETWORK_LINE="network --bootproto=dhcp --device=$PRIMARY_NIC --onboot=yes --activate --noipv6 --hostname=cephnode"
fi

cat <<EOF > /tmp/disk-config
$NETWORK_LINE

zerombr
ignoredisk --only-use=$D1,$D2
clearpart --all --initlabel --drives=$D1,$D2

# Disk partitioning information
# --size values are minimums only; --grow fills all remaining space.
# Kept small so the layout fits any real-world drive size
# (a "32GB" SSD is often only ~30.5 GiB usable).
part raid.622 --fstype="mdmember" --ondisk=$D2 --size=10240 --grow
part raid.615 --fstype="mdmember" --ondisk=$D1 --size=10240 --grow
part raid.244 --fstype="mdmember" --ondisk=$D2 --size=512
part raid.237 --fstype="mdmember" --ondisk=$D1 --size=512
raid /boot/efi --device=boot_efi --fstype="efi" --level=RAID1 --fsoptions="umask=0077,shortname=winnt" raid.237 raid.244
raid / --device=root --fstype="xfs" --level=RAID1 raid.615 raid.622

EOF
%end


# -------------------------------------------------
# POST-INSTALL: Sync EFI + Install GRUB
# -------------------------------------------------
%post --log=/root/kickstart-post.log --interpreter=/bin/bash
cat >/etc/yum.repos.d/45drives-enterprise.repo <<EOF
[45drives_enterprise]
enabled = 1
priority = 1
gpgcheck = 1
repo_gpgcheck = 1
baseurl = https://repo.45drives.com/enterprise/rocky/el9/stable
gpgkey = https://repo.45drives.com/key/gpg.asc
name = 45Drives Enterprise $releasever Repo

[45drives_enterprise_testing]
enabled = 0
priority = 1
gpgcheck = 1
repo_gpgcheck = 1
baseurl = https://repo.45drives.com/enterprise/rocky/el9/testing
gpgkey = https://repo.45drives.com/key/gpg.asc
name = 45Drives Enterprise $releasever Testing Repo
EOF

cat >/etc/yum.repos.d/ceph-stable.repo <<EOF
[ceph_stable]
baseurl = http://download.ceph.com/rpm-squid/el9/x86_64
gpgcheck = 1
gpgkey = https://download.ceph.com/keys/release.asc
name = Ceph Stable \$basearch repo
priority = 2

[ceph_stable_noarch]
baseurl = http://download.ceph.com/rpm-squid/el9/noarch
gpgcheck = 1
gpgkey = https://download.ceph.com/keys/release.asc
name = Ceph Stable noarch repo
priority = 2
EOF

dnf install -y epel-release
dnf install -y 45drives-tools
setenforce 0
sed -i 's/^\(SELINUX=\).*$/\1permissive/' /etc/selinux/config
dnf -y install dnf-plugins-core
crb enable
dnf install -y cephadm podman cockpit cockpit-bridge cockpit-benchmark cockpit-navigator cockpit-file-sharing cockpit-45drives-hardware cockpit-identities cockpit-storaged cockpit-scheduler nano tuned
firewall-cmd --add-service=cockpit --permanent
firewall-cmd --reload
systemctl enable --now cockpit.socket
sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
cephadm pull
sed -i '/^root$/d' /etc/cockpit/disallowed-users 2>/dev/null || true
dnf update -y --nobest

%end

